suppress_unstable_features_warning = true
web_search = "cached"
model = "__GPT__"
enabled-reasoning-efforts = ["medium", "high", "max"]
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "danger-full-access"
personality = "pragmatic"
model_verbosity = "low"
model_reasoning_summary = "concise"
notify = ["turn-ended"]
oss_provider = "lmstudio"

[features]
apply_patch_streaming_events = true
apps = true
artifact = true
auth_elicitation = true
browser_use = true
browser_use_external = true
builtin_mcp = true
child_agents_md = true
chronicle = true
code_mode = true
code_mode_only = true
computer_use = true
default_mode_request_user_input = true
enable_mcp_apps = true
enable_request_compression = true
exec_permission_approvals = true
fast_mode = false
general_analytics = true
goals = true
guardian_approval = true
hooks = true
image_generation = true
in_app_browser = true
memories = true
multi_agent = true
multi_agent_v2 = false
personality = true
plugins = true
prevent_idle_sleep = true
realtime_conversation = true
remote_compaction_v2 = true
remote_plugin = true
request_permissions_tool = true
responses_websocket_response_processed = true
runtime_metrics = true
shell_snapshot = true
shell_tool = true
shell_zsh_fork = false
skill_mcp_dependency_install = true
tool_call_mcp_elicitation = true
tool_suggest = true
unified_exec = true
voice_transcription = true
workspace_dependencies = true

[features.context_management]
experimental_mode = true

[agents]
enabled = true
max_concurrent_threads_per_session = 300
default_subagent_model = "__GPT_LUNA__"
default_subagent_reasoning_effort = "max"

[model_providers.cliproxyapi]
name = "CLIProxyAPI"
base_url = "https://cliproxy.shunkakinoki.com/v1"
env_key = "CLIPROXY_API_KEY"

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"

[profiles.cliproxy]
model = "__GPT__"
model_provider = "cliproxyapi"

[profiles.qwen-local]
model = "__QWEN_LOCAL__"
model_provider = "lmstudio"
model_reasoning_effort = "minimal"

[desktop]
preventSleepWhileRunning = true
show-context-window-usage = true
notifications-turn-mode = "always"
composerEnterBehavior = "cmdIfMultiline"
reviewDelivery = "inline"

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true
