worktree-path = "{{ repo_path }}/.worktrees/{{ branch | sanitize }}"

[post-start]
copy = "wt step copy-ignored"

[step.copy-ignored]
# .worktrees/ lives inside the repo and is gitignored, so without this every new
# worktree recursively copies all sibling worktrees.
exclude = [".cache/", ".devenv/", ".serena/", ".worktrees/", ".claude/worktrees/", "node_modules/"]

[commit]
stage = "all"

[commit.generation]
command = "MAX_THINKING_TOKENS=0 claude -p --model=haiku --tools='' --disable-slash-commands --setting-sources='' --system-prompt=''"

[list]
summary = true

[merge]
squash = true
commit = true
rebase = true
remove = true
verify = true
