worktree-path = "{{ repo_path }}/.worktrees/{{ branch | sanitize }}"

[post-start]
copy = "wt step copy-ignored"

[step.copy-ignored]
# Reflink copies still cost one fs op per file, so node_modules/ floods
# fseventsd; repos reinstall deps in their own post-start hooks.
exclude = [".cache/", ".devenv/", ".serena/", ".claude/worktrees/", "node_modules/"]

[commit]
stage = "all"

[commit.generation]
command = "MAX_THINKING_TOKENS=0 claude -p --model=haiku --tools='' --disable-slash-commands --setting-sources='' --system-prompt=''"

[list]
summary = true

[merge]
squash = true
commit = true
rebase = true
remove = true
verify = true
