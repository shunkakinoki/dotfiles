# OpenCode 1.18 keeps live activity in the footer; quoted tool output is history.
# Retain the upstream permission rules from Herdr 0.9.0.
id = "opencode"
version = "2026.09.11.1"
min_engine_version = 1
updated_at = "2026-09-11T00:00:00Z"
aliases = ["open-code", "herdr:opencode"]

[[rules]]
id = "permission_required"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
any = [
  { contains = [
    "△ Permission required",
  ] },
  { contains = [
    "esc dismiss",
  ], any = [
    { contains = [
      "enter confirm",
    ] },
    { contains = [
      "enter submit",
    ] },
    { contains = [
      "enter toggle",
    ] },
  ], all = [
    { any = [
      { contains = [
        "↑↓ select",
      ] },
      { contains = [
        "⇆ tab",
      ] },
    ] },
  ] },
]

[[rules]]
id = "interrupt_hint_working"
state = "working"
priority = 110
region = "bottom_non_empty_lines(3)"
visible_working = true
any = [
  { contains = [
    "esc to interrupt",
  ] },
  { contains = [
    "ctrl+c to interrupt",
  ] },
  { contains = [
    "press esc to interrupt",
  ] },
  { line_regex = [
    '(?i).*opencode.*esc (again to )?interrupt',
  ] },
]

[[rules]]
id = "progress_bar_working"
state = "working"
priority = 100
region = "bottom_non_empty_lines(3)"
visible_working = true
regex = ['(■|⬝){4,}']
