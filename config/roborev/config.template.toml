# Keep review concurrency bounded on every host. Kyber's orchestration slice
# provides an additional host-level containment boundary.
max_workers = 4

# Upstream falls back to codex when no workflow agent is set; codex is not
# usable here, so pin the default to opencode.
default_agent = 'opencode'

# Pi review subagents: ox-alpha via OpenRouter first, cliproxy free as fallback.
# Both are allow-failure; panels list pi-oxalpha before pi so ox-alpha runs first.
[review.subagents.pi-oxalpha]
agent = 'pi'
provider = 'openrouter'
model = 'stealth/ox-alpha'
review_type = 'default'
allow_failure = true

[review.subagents.pi]
agent = 'pi'
provider = 'cliproxyapi'
model = 'free'
review_type = 'default'
allow_failure = true

[review.subagents.antigravity]
agent = 'acp.antigravity'
review_type = 'default'
allow_failure = true

[review.subagents.opencode]
agent = 'opencode'
review_type = 'default'
allow_failure = true

[review.subagents.droid]
agent = 'droid'
review_type = 'default'
allow_failure = true

[review.panels.full]
# Droid is useful when available, but its Kyber launcher is currently flaky.
members = ['antigravity', 'opencode', 'droid', 'pi-oxalpha', 'pi']
synthesis_agent = 'gemini'

[ci]
enabled = true
# Poll frequently so new pushes reach the daemon promptly.
poll_interval = "1m"
# Review maintainer pushes immediately so restacked heads do not wait behind
# the default per-PR throttle.
throttle_bypass_users = ["shunkakinoki"]
# Never cancel a running CI review just to post an early result.
batch_timeout = "0"
repos = ["__ROBOREV_REPOS__"]

[agent_hook]
# Surface any open failed review without automatically invoking a fixer.
# Keep turn and commit triggers explicitly disabled.
turn_threshold = 0
commit_threshold = 0
failed_review_threshold = 1
instruction = "Inspect open RoboRev findings read-only. Report proposed changes and ask the user for explicit approval. Do not edit files, run a fixer, commit, or close reviews before approval."
