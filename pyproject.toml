[project]
name = "dotfiles"
version = "0.1.0"
requires-python = ">=3.13"

# UV global tools - installed as isolated environments via uv tool install.
# Listed here for Renovate to track version updates.
# These conflict with each other so cannot be co-installed; use: uv tool install <package>
[dependency-groups]
tools = [
  "aider-chat>=0.86.2",
  "agentsview>=0.41.1",
  "claude-swap>=0.25.0",
  "git-remote-s3>=0.4.2",
  "graphifyy>=0.9.53",
  "huggingface-hub[mcp]>=1.29.0",
  "marker-pdf>=2.0.0",
  "mempalace>=3.8.0",
  "mistral-vibe>=2.24.5",
  "nvitop>=1.7.1",
  "ruff>=0.16.5",
  "serena-agent>=1.7.0",
  "transformers>=5.16.1",
  "vllm>=0.28.0",
  "vllm-mlx>=0.4.1",
]
# Hermes gateway runtime deps - installed into hermes venv via uv pip install
hermes = [
  "python-telegram-bot[webhooks]>=22.8,<23",
  "croniter>=6.2.4,<7",
  "fastapi[standard]>=0.141.1",
  "uvicorn>=0.52.4",
]

[tool.uv]
exclude-newer = "1 week"

[tool.uv-globals]
# Packages that require --prerelease=allow during uv tool install
prerelease = ["serena-agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
