[project]
name = "dotfiles"
version = "0.1.0"
requires-python = ">=3.13"

# UV global tools - installed as isolated environments via uv tool install.
# Listed here for Renovate to track version updates.
# These conflict with each other so cannot be co-installed; use: uv tool install <package>
[dependency-groups]
tools = [
  "aider-chat>=0.86.2",
  "claude-swap>=0.27.2",
  "git-remote-s3>=0.4.2",
  "graphifyy>=0.9.94",
  "huggingface-hub[mcp]>=2.2.0",
  "marker-pdf>=2.0.0",
  "mempalace>=3.11.0",
  "mistral-vibe>=2.26.1",
  "nvitop>=1.7.1",
  "ruff>=0.17.2",
  "serena-agent>=2.1.0",
  "transformers>=5.20.2",
  "vllm>=0.32.0",
  "vllm-mlx>=0.6.0",
]
# Hermes gateway runtime deps - installed into hermes venv via uv pip install
hermes = [
  "python-telegram-bot[webhooks]>=22.8,<23",
  "croniter>=6.2.4,<7",
  "fastapi[standard]>=0.156.8",
  "uvicorn>=0.54.0",
]

[tool.uv]
exclude-newer = "1 week"

[tool.uv-globals]
# Packages that require --prerelease=allow during uv tool install
prerelease = ["serena-agent"]
# Installed only where modules.uvGlobals.gpuTools is set; uninstalled elsewhere.
gpu = ["huggingface-hub", "marker-pdf", "nvitop", "transformers", "vllm"]
# Apple MLX: installed only on macOS; uninstalled elsewhere.
darwin = ["vllm-mlx"]

# Git-sourced uv tools (not Renovate-tracked PyPI pins).
# Do NOT add PyPI agent-reach (jgalea/agent-reach 0.1.0) — wrong package.
# After first install, optional post-setup (document only; do not auto-run --system):
#   agent-reach install --env=auto   # read-only check
#   agent-reach install --system     # needs explicit user approve
[tool.uv-globals.git-tools]
agent-reach = "git+https://github.com/Panniantong/Agent-Reach.git"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
