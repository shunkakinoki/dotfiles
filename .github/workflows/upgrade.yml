name: Upgrade
on:
  push:
    branches:
      - main
  # pull_request:
  #   branches:
  #     - main
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Upgrade
        run: |
          git config --global url."https://x-access-token:${PAT_TOKEN}@github.com/".insteadOf "https://github.com/"
          make upgrade-dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          SKIP_HOME_MANAGER_SWITCH: "true"
      - name: Cancel stale runs on upgrade branch
        if: github.event_name != 'pull_request'
        run: |
          gh run list --branch chore/upgrade --status queued --json databaseId -q '.[].databaseId' | xargs -rn1 gh run cancel || true
          gh run list --branch chore/upgrade --status in_progress --json databaseId -q '.[].databaseId' | xargs -rn1 gh run cancel || true
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      - name: Create Pull Request
        if: github.event_name != 'pull_request'
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: 'chore: upgrade'
          title: 'chore: upgrade'
          body: Automated upgrade
          base: main
          branch: chore/upgrade
          delete-branch: true
      - name: Enable Auto-Merge
        if: steps.cpr.outputs.pull-request-number
        run: |
          if ! result=$(gh pr merge "$UPGRADE_PR" --squash --auto 2>&1); then
            if [[ "$result" != *"Pull request is in clean status"* ]]; then
              printf '%s\n' "$result" >&2
              exit 1
            fi
            # GitHub refuses auto-merge when the PR can already merge directly.
            # Keep normal branch rules and require the exact generated head.
            gh pr merge "$UPGRADE_PR" --squash --match-head-commit "$UPGRADE_HEAD"
          fi
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          UPGRADE_PR: ${{ steps.cpr.outputs.pull-request-number }}
          UPGRADE_HEAD: ${{ steps.cpr.outputs.pull-request-head-sha }}
  upgrade-check:
    if: always()
    needs:
      - upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Alls Green
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
